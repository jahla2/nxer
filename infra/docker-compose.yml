services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web-react, control-fastapi, gateway-go]
  web-react:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    expose: ["5173"]
  gateway-go:
    image: golang:1.23-alpine
    working_dir: /app
    volumes: ["../apps/gateway:/app"]
    command: go run .
    env_file: ["../.env"]
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  control-fastapi:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../apps/control-api:/app"]
    command: sh -c "pip install -e . && uvicorn nexora_control.main:app --app-dir src --host 0.0.0.0 --port 8001"
    env_file: ["../.env"]
    expose: ["8001"]
    depends_on:
      postgres: {condition: service_healthy}
  celery-worker:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app worker --loglevel=INFO"
    env_file: ["../.env"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  celery-beat:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app beat --loglevel=INFO"
    env_file: ["../.env"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  migrate:
    image: postgres:17-alpine
    env_file: ["../.env"]
    volumes: ["../migrations:/migrations:ro"]
    command: sh -c 'for f in /migrations/*.sql; do echo "Applying $$f"; psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f"; done'
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  bootstrap:
    image: postgres:17-alpine
    env_file: ["../.env"]
    volumes: ["./postgres/bootstrap-local.sql:/bootstrap.sql:ro"]
    command: sh -c 'psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /bootstrap.sql'
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nexora -d nexora"], interval: 3s, timeout: 3s, retries: 20}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass nexora --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","-a","nexora","ping"], interval: 3s, timeout: 3s, retries: 20}
volumes: {postgres_data: {}}
