services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web-react, control-fastapi, gateway-go]
  web-react:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    expose: ["5173"]
  gateway-go:
    image: golang:1.23-alpine
    working_dir: /app
    volumes: ["../apps/gateway:/app"]
    command: go run .
    env_file: ["../.env"]
    expose: ["8080"]
  control-fastapi:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../apps/control-api:/app"]
    command: sh -c "pip install -e . && uvicorn nexora_control.main:app --app-dir src --host 0.0.0.0 --port 8001"
    env_file: ["../.env"]
    expose: ["8001"]
  celery-worker:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app worker --loglevel=INFO"
    env_file: ["../.env"]
    depends_on: [redis]
  celery-beat:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app beat --loglevel=INFO"
    env_file: ["../.env"]
    depends_on: [redis]
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: nexora, POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass nexora --maxmemory 256mb --maxmemory-policy allkeys-lru
volumes: {postgres_data: {}}
