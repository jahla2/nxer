services:
  postgres:
    image: postgres:17-alpine
    env_file: ["../.env"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:8-alpine
    env_file: ["../.env"]
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    env_file: ["../.env"]
    volumes:
      - "../migrations:/migrations:ro"
      - "./postgres/migrate.sh:/migrate.sh:ro"
    command: sh /migrate.sh
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../apps/control-api:/app"]
    command: sh -c "pip install -e . && python -m nexora_control.bootstrap"
    env_file: ["../.env"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  gateway-go:
    image: golang:1.26.8-alpine
    working_dir: /app
    volumes: ["../apps/gateway:/app"]
    command: go run .
    env_file: ["../.env"]
    expose: ["8080"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  control-fastapi:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../apps/control-api:/app"]
    command: sh -c "pip install -e . && uvicorn nexora_control.main:app --app-dir src --host 0.0.0.0 --port 8001"
    env_file: ["../.env"]
    expose: ["8001"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped

  celery-worker:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app worker --loglevel=INFO"
    env_file: ["../.env"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  celery-beat:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["../workers/tasks:/app"]
    command: sh -c "pip install -e . && celery -A worker.app beat --loglevel=INFO"
    env_file: ["../.env"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  web-react:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    expose: ["5173"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      web-react: {condition: service_started}
      control-fastapi: {condition: service_started}
      gateway-go: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres_data: {}
