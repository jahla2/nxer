events {}
http {
  server {
    listen 80;
    client_max_body_size 1m;
    location / { proxy_pass http://web-react:5173; proxy_http_version 1.1; }
    location /api/ { proxy_pass http://control-fastapi:8001/; proxy_http_version 1.1; }
    location /v1/ {
      proxy_pass http://gateway-go:8080;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      add_header X-Accel-Buffering no;
    }
    location = /health { proxy_pass http://gateway-go:8080/health; }
  }
}
