user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 15s;
    client_max_body_size 1m;

    log_format nexora_json escape=json
      '{"time":"$time_iso8601","request_id":"$request_id",'
      '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
      '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    access_log /dev/stdout nexora_json;
    error_log /dev/stderr warn;

    map $http_x_forwarded_proto $origin_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream nexora_web {
        server web-react:8080;
        keepalive 16;
    }

    upstream nexora_control {
        server control-fastapi:8001;
        keepalive 32;
    }

    upstream nexora_gateway {
        server gateway-go:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

        location = /edge-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"edge"}';
        }

        location / {
            proxy_pass http://nexora_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/ {
            proxy_pass http://nexora_control/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /v1/ {
            proxy_pass http://nexora_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_read_timeout 310s;
            proxy_send_timeout 310s;
            add_header X-Accel-Buffering "no" always;
        }

        location = /health {
            proxy_pass http://nexora_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /ready {
            proxy_pass http://nexora_gateway/ready;
            proxy_http_version 1.1;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
