[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "redis>=5,<6",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["worker", "settings", "operations", "catalog_sync", "usage_jobs"]

[tool.pytest.ini_options]
pythonpath = ["."]
