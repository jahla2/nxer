name: ci
on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      API_KEY_HASH_PEPPER: test-api-key-pepper-that-is-longer-than-thirty-two-characters
      API_KEY_AUTH_CACHE_TTL_SECONDS: "300"
    defaults: {run: {working-directory: apps/gateway}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.x"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cd ../.. && MIGRATIONS_DIR="$GITHUB_WORKSPACE/migrations" sh infra/postgres/migrate.sh
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - run: go test -race ./...

  control-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: test-session-secret-that-is-longer-than-thirty-two-characters
      API_KEY_HASH_PEPPER: test-api-key-pepper-that-is-longer-than-thirty-two-characters
      ENVIRONMENT: test
      DEV_EXPOSE_PASSWORD_RESET_TOKEN: "true"
      DEV_EXPOSE_EMAIL_VERIFICATION_TOKEN: "true"
      LOCAL_BOOTSTRAP_ENABLED: "false"
    defaults: {run: {working-directory: apps/control-api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cd ../.. && MIGRATIONS_DIR="$GITHUB_WORKSPACE/migrations" sh infra/postgres/migrate.sh
      - run: pip install -e ".[dev]"
      - run: pytest -q

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OPENROUTER_API_KEY: test-provider-key-not-used-by-unit-tests
      FREE_MODEL_SYNC_INTERVAL_MINUTES: "10"
    defaults: {run: {working-directory: workers/tasks}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cd ../.. && MIGRATIONS_DIR="$GITHUB_WORKSPACE/migrations" sh infra/postgres/migrate.sh
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q .
      - run: python -c "import worker; assert 'sync-free-model-catalog' in worker.app.conf.beat_schedule; assert 'aggregate-usage-every-minute' in worker.app.conf.beat_schedule; assert 'housekeeping-hourly' in worker.app.conf.beat_schedule"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora
      MIGRATIONS_DIR: ${{ github.workspace }}/migrations
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: sh infra/postgres/migrate.sh
      - run: sh infra/postgres/migrate.sh
      - name: Verify schema
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM schema_migrations")" = "9"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT is_nullable FROM information_schema.columns WHERE table_name='usage_daily' AND column_name='model_id'")" = "YES"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM pg_indexes WHERE tablename='usage_daily' AND indexname='ux_usage_daily_dimensions'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.columns WHERE table_name='models' AND column_name='provider_key'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.columns WHERE table_name='models' AND column_name='context_length'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_name='email_verification_tokens'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_name='background_job_runs'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_name='catalog_sync_state'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_name='usage_aggregation_state'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM models WHERE public_id='auto-free' AND active=true AND is_free=true")" = "1"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml config
